# ============================================================
# Rollback — manual trigger only.
#
# Restores a previously promoted staging artifact by downloading
# it, verifying its checksums, running the smoke test, and
# recording the rollback as a new deployment event.
#
# WHEN TO USE THIS WORKFLOW
# -------------------------
# Use this workflow when a bad commit has been merged to main and
# the current staging artifact must be replaced with an earlier
# known-good one.
#
# When a rollback is NOT sufficient
# ----------------------------------
# If the defect was in the *data generation logic* (generate.py,
# validators.py, checks.py), the artifacts from before the bad commit
# were generated with the defective code.  In that case:
#   1. Fix the code and merge the fix to main.
#   2. Let the normal push-to-main pipeline regenerate and promote
#      a new clean artifact.
#   3. Do NOT use this rollback workflow — it would restore the old
#      defective artifact.
#
# See scripts/rollback.md for the full decision tree and post-mortem
# checklist.
#
# INPUTS
# ------
# artifact_name  Name of the artifact to restore, e.g.:
#                  staging-abc1234def5678...  (full 40-char SHA)
#                Leave blank to list the last 5 staging artifacts
#                (dry-run mode — no rollback performed).
# ============================================================

name: Rollback

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: >
          Full artifact name to restore, e.g. staging-<commit-sha>.
          Leave blank to list recent staging artifacts (dry run).
        required: false
        default: ""
      reason:
        description: "Reason for rollback (recorded in deployment log)"
        required: true
        default: "Manual rollback"

permissions:
  actions: read       # download artifacts
  deployments: write  # record rollback deployment status

jobs:
  rollback:
    name: rollback
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e .

      - name: List recent staging artifacts (dry run if no artifact_name)
        if: inputs.artifact_name == ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
            });
            const staging = artifacts.data.artifacts
              .filter(a => a.name.startsWith('staging-'))
              .slice(0, 5);
            console.log('Recent staging artifacts (newest first):');
            staging.forEach(a => {
              console.log(`  ${a.name}  (created: ${a.created_at}, expired: ${a.expires_at})`);
            });
            console.log('\nRe-run this workflow with artifact_name set to one of the above.');
            core.setFailed('No artifact_name provided — dry run complete, no rollback performed.');

      - name: Download target artifact
        if: inputs.artifact_name != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const name = '${{ inputs.artifact_name }}';
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const target = artifacts.data.artifacts.find(a => a.name === name);
            if (!target) {
              core.setFailed(`Artifact not found: ${name}`);
              return;
            }
            console.log(`Found artifact: ${name} (id=${target.id}, created=${target.created_at})`);
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: target.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/rollback_artifact.zip', Buffer.from(download.data));
            console.log('Artifact downloaded to /tmp/rollback_artifact.zip');

      - name: Extract and verify artifact checksums
        if: inputs.artifact_name != ''
        run: |
          mkdir -p /tmp/rollback_restored
          unzip -q /tmp/rollback_artifact.zip -d /tmp/rollback_restored
          echo "Extracted contents:"
          find /tmp/rollback_restored -type f | sort
          if [ -f /tmp/rollback_restored/manifest.json ]; then
            echo ""
            echo "Manifest:"
            cat /tmp/rollback_restored/manifest.json
            echo ""
            python scripts/smoke_test.py --artifact-dir /tmp/rollback_restored
            echo "Checksum verification: PASSED"
          else
            echo "WARNING: manifest.json not found in artifact."
            echo "This artifact may have been created before build_artifact.py was added."
            echo "Proceeding with smoke test only."
            python scripts/smoke_test.py --artifact-dir /tmp/rollback_restored || true
          fi

      - name: Record rollback deployment
        if: inputs.artifact_name != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifactName = '${{ inputs.artifact_name }}';
            const reason = '${{ inputs.reason }}';
            // Extract commit SHA from artifact name (staging-<sha>)
            const sha = artifactName.replace('staging-', '');
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha.length >= 7 ? sha : context.sha,
              environment: 'staging',
              description: `ROLLBACK to ${artifactName}: ${reason}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: `Rolled back to ${artifactName} (ARTIFACT-ONLY DEMO)`,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            console.log(`Rollback deployment recorded. Active artifact: ${artifactName}`);
            console.log(`Reason: ${reason}`);
