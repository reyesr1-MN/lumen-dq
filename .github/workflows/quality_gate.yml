name: Quality Gate

# Runs on every push and on every pull request targeting main.
# The job must pass before a merge is allowed (enforce via branch protection).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: DQ checks + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install locked dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e .

      # ── Data generation ─────────────────────────────────────────────────────
      - name: Generate baseline data (seed=42, deterministic)
        run: python -m lumen_dq.generate --output-dir data/baseline

      # ── Layer 1-4 DQ checks ─────────────────────────────────────────────────
      - name: Run layered DQ checks (must pass)
        run: python -m lumen_dq.run_checks --data-dir data/baseline --strict

      # ── YAML contract validation ────────────────────────────────────────────
      - name: Validate accounts data contract
        run: |
          python -m lumen_dq.validate_contract contracts/accounts.yml \
            --data-dir data/baseline

      # ── Pytest suite ────────────────────────────────────────────────────────
      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short \
            --junitxml=evidence/junit.xml \
            --cov=lumen_dq --cov-report=term-missing

      # ── Evidence upload ─────────────────────────────────────────────────────
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dq-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90
